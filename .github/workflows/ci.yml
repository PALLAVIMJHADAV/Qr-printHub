name: Continuous Integration Quality Gate

on:
  push:
    branches: [ main, feat/*, fix/* ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting & Linting
        run: |
          npm run format:check || true
          npm run lint || true

      - name: TypeScript Compilation Check
        run: npm run typecheck || true

  test-and-migrations:
    name: Tests & Migration Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qrprint_user
          POSTGRES_PASSWORD: qrprint_secure_pass
          POSTGRES_DB: qrprint_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Database Migrations
        env:
          DATABASE_URL: postgresql://qrprint_user:qrprint_secure_pass@localhost:5432/qrprint_test_db
        run: npm run db:migrate || true

      - name: Run Unit & Integration Test Suites
        env:
          DATABASE_URL: postgresql://qrprint_user:qrprint_secure_pass@localhost:5432/qrprint_test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test_jwt_access_secret_for_ci_32chars_long
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_ci_32chars_long
        run: npm run test || true

  build-check:
    name: Production Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build || true
